<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Three.js Challenge</title>
    <link rel="icon"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%B5%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
</head>

<body>
    <div id="app"></div>

    <nav id="toolbar" aria-label="Tools">
        <p class="title">Musical lines</p>
        <button type="button" data-mode="draw"><span class="icon">✎</span> Draw lines <kbd>D</kbd></button>
        <button type="button" data-mode="edit"><span class="icon">↻</span> Edit <kbd>E</kbd></button>
        <button type="button" data-mode="balls"><span class="icon">●</span> Drop balls <kbd>B</kbd></button>
        <button type="button" data-mode="holders"><span class="icon">■</span> Holders <kbd>H</kbd></button>
        <button type="button" data-mode="repeaters"><span class="icon">◎</span> Repeaters <kbd>R</kbd></button>
        <button type="button" data-mode="play"><span class="icon">♪</span> Play <kbd>P</kbd></button>
        <button type="button" id="clear"><span class="icon">✕</span> Clear all</button>

        <!-- only shown while drawing, or with a line selected in edit mode -->
        <div id="line-types" hidden>
            <p class="title">Line type</p>
            <div class="variants">
                <button type="button" data-variant="classic">Classic <kbd>1</kbd></button>
                <button type="button" data-variant="glass">Glass <kbd>2</kbd></button>
                <button type="button" data-variant="deep">Deep <kbd>3</kbd></button>
                <button type="button" data-variant="echo">Echo <kbd>4</kbd></button>
            </div>
        </div>
        <p id="hint"></p>
    </nav>
    <p id="error" class="error" hidden></p>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
